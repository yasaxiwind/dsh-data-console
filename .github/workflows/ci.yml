name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python data libraries
        run: python -m pip install --upgrade pip pandas openpyxl

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax and sidecar tests
        run: npm test

      - name: Verify publishable package
        run: npm run verify:package

      - name: Check tarball contents
        run: npm pack --dry-run
